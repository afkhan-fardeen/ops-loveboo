name: Daily report scheduler

# Pings the portal every 15 minutes. The portal itself decides whether it is time to send,
# based on the send time an admin sets in Sales → Settings, and never sends the same day twice.
# Needs repository secrets: APP_URL (e.g. https://ops.loveboo.com) and CRON_SECRET (same value as in Vercel).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the portal
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set yet; skipping."
            exit 0
          fi
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/daily-report"
